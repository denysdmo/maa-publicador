<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda do Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #04122B; --painel: #0A2A5E; --cartao: #0E2350; --linha: rgba(127,178,255,0.18);
    --texto: #FFFFFF; --suave: rgba(255,255,255,0.7); --ouro: #E2B33C; --ciano: #3EE6FF;
    --ok: #22B573; --pend: #4FA3E0; --rasc: #8A93A6; --erro: #E5484D; --canc: #5B6478;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse 120% 60% at 50% 0%, #12407F 0%, var(--fundo) 60%); background-attachment: fixed; color: var(--texto); font-family: Nunito, system-ui, sans-serif; min-height: 100vh; }
  header { padding: 22px 16px 10px; max-width: 1400px; margin: 0 auto; }
  h1 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 26px; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: var(--ouro); }
  .sub { color: var(--suave); font-size: 14px; margin-top: 4px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  button { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 13px; color: var(--texto); background: var(--painel); border: 1px solid var(--linha); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ciano); }
  .semana { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px; margin: 0 6px; }
  .resumo { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); }
  .chip i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .dia { background: rgba(10,42,94,0.55); border: 1px solid var(--linha); border-radius: 16px; padding: 10px; min-height: 160px; }
  .dia.hoje { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro) inset; }
  .dia h2 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin: 2px 2px 10px; color: var(--suave); display: flex; justify-content: space-between; }
  .dia.hoje h2 { color: var(--ouro); }
  .post { display: flex; gap: 10px; background: var(--cartao); border-radius: 12px; padding: 8px; margin-bottom: 8px; border-left: 4px solid var(--rasc); }
  .post .mini { flex: none; width: 54px; height: 72px; border-radius: 8px; background: #061A3A center/cover no-repeat; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--suave); }
  .post .mini video { width: 100%; height: 100%; object-fit: cover; }
  .post .info { min-width: 0; flex: 1; }
  .hora { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 15px; }
  .tipo { font-weight: 800; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; }
  .status { margin-top: 4px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .status a { color: var(--ciano); text-decoration: none; }
  .nota { font-size: 11px; color: var(--suave); margin-top: 3px; word-break: break-word; }
  .manual { border-left-color: var(--ouro); background: rgba(226,179,60,0.10); padding: 6px 10px; }
  .manual .tipo { text-transform: none; letter-spacing: 0; }
  .vazio { color: var(--suave); font-size: 13px; padding: 6px 2px; }
  footer { max-width: 1400px; margin: 0 auto; padding: 0 16px 30px; color: var(--suave); font-size: 12px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .resumo { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Agenda do Instagram · <span>@meuarraisamador</span></h1>
  <div class="sub">Atualiza sozinha a partir da fila de publicação. Horários de Brasília.</div>
  <div class="barra">
    <button id="ant">‹ Semana anterior</button>
    <button id="hoje">Hoje</button>
    <button id="prox">Próxima semana ›</button>
    <span class="semana" id="titulo"></span>
    <div class="resumo" id="resumo"></div>
  </div>
</header>
<main id="grade"></main>
<footer id="rodape"></footer>
<script>
const STATUS = {
  publicado: { cor: "var(--ok)", txt: "Publicado" },
  pendente: { cor: "var(--pend)", txt: "Agendado" },
  rascunho: { cor: "var(--rasc)", txt: "Aguardando sua aprovação" },
  erro: { cor: "var(--erro)", txt: "Falhou" },
  atrasado: { cor: "var(--erro)", txt: "Não saiu (atrasado)" },
  cancelado: { cor: "var(--canc)", txt: "Cancelado" },
};
const TIPO = { story: "Story", post: "Post", carrossel: "Carrossel", reel: "Reel" };
const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
let fila = [];
let inicio = segunda(new Date());

function segunda(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function mesmoDia(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dd(d) { return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); }

// CSV simples com aspas
function lerCSV(txt) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  txt = txt.replace(/^﻿/, "");
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (aspas) { if (c === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (c === '"') aspas = false; else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  const cab = linhas.shift() || [];
  return linhas.filter((l) => l.length > 1).map((l) => Object.fromEntries(cab.map((k, i) => [k.trim(), (l[i] || "").trim()])));
}

async function carregar() {
  try {
    const r = await fetch("fila.csv?t=" + Date.now(), { cache: "no-store" });
    fila = lerCSV(await r.text()).map((p) => ({ ...p, data: new Date(p.quando) }));
    document.getElementById("rodape").textContent = "Última leitura da fila: " + new Date().toLocaleTimeString("pt-BR") + " · " + fila.length + " itens na fila. Stories com sticker (quiz, enquete, caixinha) e o CTA de link das 20h são postados por você no app.";
  } catch (e) {
    document.getElementById("rodape").textContent = "Não consegui ler a fila agora (" + e + "). Tente recarregar.";
  }
  desenhar();
}

function mini(p) {
  const a = (p.arquivos || "").split("|")[0].trim();
  if (!a) return '<div class="mini">—</div>';
  if (p.status === "publicado") return '<div class="mini">✓</div>'; // a mídia sai do repositório depois de postada
  if (/\.(mp4|mov)$/i.test(a)) return '<div class="mini"><video src="' + a + '#t=2.6" muted preload="metadata"></video></div>';
  return '<div class="mini" style="background-image:url(\'' + a + '\')"></div>';
}

function cartao(p) {
  const s = STATUS[p.status] || { cor: "var(--rasc)", txt: p.status || "—" };
  const h = String(p.data.getHours()).padStart(2, "0") + ":" + String(p.data.getMinutes()).padStart(2, "0");
  const n = (p.arquivos || "").split("|").filter((x) => x.trim()).length;
  const tipo = (TIPO[p.tipo] || p.tipo) + (p.tipo === "carrossel" ? " · " + n + " slides" : "");
  let st = s.txt;
  if (p.status === "publicado" && /^https?:/.test(p.resultado)) st = '<a href="' + p.resultado + '" target="_blank" rel="noopener">Publicado · ver ↗</a>';
  const nota = (p.status === "erro" || p.status === "atrasado") && p.resultado ? '<div class="nota">' + p.resultado.replace(/</g, "&lt;") + "</div>" : "";
  return '<div class="post" style="border-left-color:' + s.cor + '">' + mini(p) + '<div class="info"><div class="hora">' + h + '</div><div class="tipo">' + tipo + '</div><div class="status" style="color:' + s.cor + '">' + st + "</div>" + nota + "</div></div>";
}

function desenhar() {
  const fim = new Date(inicio); fim.setDate(fim.getDate() + 7);
  document.getElementById("titulo").textContent = dd(inicio) + " a " + dd(new Date(fim.getTime() - 86400000));
  const daSemana = fila.filter((p) => p.data >= inicio && p.data < fim);
  const conta = (st) => daSemana.filter((p) => p.status === st).length;
  document.getElementById("resumo").innerHTML = ["publicado", "pendente", "rascunho", "erro"].map((k) => '<span class="chip"><i style="background:' + STATUS[k].cor + '"></i>' + STATUS[k].txt.split(" ")[0] + ": " + conta(k) + "</span>").join("");
  const hoje = new Date();
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicio); d.setDate(d.getDate() + i);
    const posts = daSemana.filter((p) => mesmoDia(p.data, d)).sort((a, b) => a.data - b.data);
    const manual = '<div class="post manual"><div class="info"><div class="hora">20:00 · CTA com link</div><div class="tipo">Você posta no app (aviso chega no celular)</div></div></div>';
    html += '<section class="dia' + (mesmoDia(d, hoje) ? " hoje" : "") + '"><h2><span>' + DIAS[d.getDay()] + "</span><span>" + dd(d) + "</span></h2>" + (posts.length ? posts.map(cartao).join("") : '<div class="vazio">Nada agendado</div>') + manual + "</section>";
  }
  document.getElementById("grade").innerHTML = html;
}

document.getElementById("ant").onclick = () => { inicio.setDate(inicio.getDate() - 7); desenhar(); };
document.getElementById("prox").onclick = () => { inicio.setDate(inicio.getDate() + 7); desenhar(); };
document.getElementById("hoje").onclick = () => { inicio = segunda(new Date()); desenhar(); };
carregar();
setInterval(carregar, 5 * 60 * 1000);
</script>
</body>
</html>
