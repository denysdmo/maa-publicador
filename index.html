<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda do Instagram</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icones/icone-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Agenda MAA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04122B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #04122B; --painel: #0A2A5E; --cartao: #0E2350; --linha: rgba(127,178,255,0.18);
    --texto: #FFFFFF; --suave: rgba(255,255,255,0.7); --ouro: #E2B33C; --ciano: #3EE6FF;
    --ok: #22B573; --pend: #4FA3E0; --rasc: #8A93A6; --erro: #E5484D; --canc: #5B6478;
    --st-agendado: #2BD47D; --st-aguarda: #FFB020; --st-publicado: #9DB4D6; /* status bem diferentes (14/11) */
    --t-story: #3EE6FF; --t-post: #B48CFF; --t-carrossel: #FF9F43; --t-reel: #FF5C8A; /* faixa lateral = tipo (14/11) */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse 120% 60% at 50% 0%, #12407F 0%, var(--fundo) 60%); background-attachment: fixed; color: var(--texto); font-family: Nunito, system-ui, sans-serif; min-height: 100vh; }
  header { padding: 22px 16px 10px; max-width: 1400px; margin: 0 auto; }
  h1 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 26px; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: var(--ouro); }
  .sub { color: var(--suave); font-size: 14px; margin-top: 4px; }
  [hidden] { display: none !important; }
  .topo { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .abas { display: flex; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 4px; }
  .aba { background: transparent; border: 0; padding: 10px 18px; font-size: 14px; }
  .aba.ativa { background: var(--ouro); color: #04122B; }
  .navsem { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
  .seta { width: 46px; height: 46px; padding: 0; font-size: 26px; line-height: 1; }
  .semtxt { display: flex; flex-direction: column; align-items: center; min-width: 170px; }
  .semtxt b { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 18px; }
  .link { background: none; border: 0; padding: 4px 0 0; color: var(--ciano); font-size: 12px; }
  .pend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 14px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--ouro); background: rgba(226,179,60,0.10); }
  .pendtxt b { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 18px; color: var(--ouro); margin-right: 6px; }
  .pendtxt span { font-size: 14px; }
  .pendbot { display: flex; flex-wrap: wrap; gap: 8px; }
  #ctrlAgenda .resumo { justify-content: center; margin: 12px 0 0; }
  button { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 13px; color: var(--texto); background: var(--painel); border: 1px solid var(--linha); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ciano); }
  .semana { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px; margin: 0 6px; }
  .resumo { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); }
  .chip i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .dia { background: rgba(10,42,94,0.55); border: 1px solid var(--linha); border-radius: 16px; padding: 10px; min-height: 160px; }
  .dia.hoje { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro) inset; }
  .dia h2 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin: 2px 2px 10px; color: var(--suave); display: flex; justify-content: space-between; }
  .dia.hoje h2 { color: var(--ouro); }
  .post { display: flex; gap: 10px; background: var(--cartao); border-radius: 12px; padding: 8px; margin-bottom: 8px; border-left: 7px solid var(--rasc); }
  .etq { display: inline-block; padding: 2px 8px; border-radius: 99px; color: #04122B; font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-right: 6px; vertical-align: 1px; }
  .post .mini { flex: none; width: 54px; height: 72px; border-radius: 8px; background: #061A3A center/cover no-repeat; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--suave); }
  .post .mini video { width: 100%; height: 100%; object-fit: cover; }
  .post .info { min-width: 0; flex: 1; }
  .hora { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 15px; }
  .tipo { font-weight: 800; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; }
  .status { margin-top: 4px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .status a { color: var(--ciano); text-decoration: none; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; color: #04122B; font-size: 10px; font-weight: 900; letter-spacing: 0.8px; }
  .post.aguarda { box-shadow: inset 0 0 0 2px rgba(255,176,32,0.75); }
  .post.agendado { box-shadow: inset 0 0 0 1px rgba(43,212,125,0.35); }
  .nota { font-size: 11px; color: var(--suave); margin-top: 3px; word-break: break-word; }
  .manual { border-left: 7px dashed var(--t-story); background: linear-gradient(90deg, rgba(62,230,255,0.16), rgba(62,230,255,0.04) 60%); padding: 6px 10px; }
  .manual { display: flex; gap: 10px; cursor: pointer; }
  .manual .tipo { text-transform: none; letter-spacing: 0; }
  .vazio { color: var(--suave); font-size: 13px; padding: 6px 2px; }
  footer { max-width: 1400px; margin: 0 auto; padding: 0 16px 30px; color: var(--suave); font-size: 12px; }
  .post:not(.manual) { cursor: pointer; }
  .post:not(.manual):active { transform: scale(0.98); }
  .abrir { margin-top: 4px; font-size: 11px; font-weight: 800; color: var(--ciano); }
  button.destaque { background: var(--ouro); color: #04122B; border-color: var(--ouro); }
  /* visor de mídia (12/11): toque num post para ver a arte inteira, o vídeo e a legenda */
  #visor { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: rgba(2,8,20,0.96); }
  #visor.aberto { display: flex; }
  .vtopo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  .vtopo .vt { flex: 1; min-width: 0; }
  .vt .hora { font-size: 16px; }
  .vfechar { font-size: 20px; line-height: 1; padding: 8px 14px; }
  .vmidia { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px; }
  .vmidia > * { flex: none; scroll-snap-align: center; height: 100%; max-width: calc(100vw - 32px); object-fit: contain; border-radius: 14px; background: #061A3A; }
  .vmidia > :first-child { margin-left: auto; }
  .vmidia > :last-child { margin-right: auto; }
  .vmidia .aviso { height: auto; padding: 30px 24px; text-align: center; color: var(--suave); font-size: 15px; max-width: 420px; }
  .vmidia .aviso a { color: var(--ciano); }
  .vlegenda { max-height: 24vh; overflow-y: auto; margin: 10px 16px 0; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.06); white-space: pre-wrap; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.88); }
  .vlegenda:empty { display: none; }
  .vlegwrap { position: relative; }
  .vlegwrap .vlegenda { padding-right: 60px; }
  .vcopiar { position: absolute; top: 8px; right: 36px; width: 34px; height: 34px; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: #1E5BB8; color: #fff; cursor: pointer; }
  .vcopiar:hover { background: #2A6FD6; }
  .vcopiar svg { width: 18px !important; height: 18px !important; min-width: 18px; flex: none; margin: 0; }
  .vcopiar.ok { background: #22B573; }
  .vcopiar[hidden] { display: none; }
  #confirma { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(2,9,21,0.72); padding: 16px; }
  #confirma.aberto { display: flex; }
  #confirma .caixa { width: 100%; max-width: 360px; background: #0B1D3A; border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 22px 20px; text-align: center; color: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #confirma .tit { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 18px; }
  #confirma .sub { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.4; }
  #confirma .botoes { display: flex; gap: 10px; margin-top: 18px; }
  #confirma .botoes button { flex: 1; padding: 13px 10px; border: 0; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
  #confirma .sim { background: #22B573; color: #fff; } #confirma .nao { background: rgba(255,255,255,0.12); color: #fff; }
  #confirma input { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #061A3A; color: #fff; font-size: 14px; }
  #confirma a { color: #3EE6FF; }
  .vbase { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .vbase .vcont { font-family: Montserrat, sans-serif; font-weight: 800; font-size: 13px; color: var(--suave); text-align: center; }
  .vbase button:disabled { opacity: 0.3; }
  /* relatório da semana (14/11) */
  .rel .rtopo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .rel .rtopo b { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 16px; }
  .rel .rtopo button { padding: 6px 12px; }
  .rnums { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .rnum { border-radius: 12px; padding: 9px 11px; background: rgba(255,255,255,0.05); }
  .rnum span { display: block; font-size: 11px; color: var(--suave); }
  .rnum b { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 18px; }
  .rnum i { font-style: normal; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .rsec { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border-left: 5px solid var(--suave); }
  .rsec h4 { margin: 0 0 6px; font-family: Montserrat, sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .rsec ul, .rsec ol { margin: 0; padding-left: 18px; } .rsec li { margin: 5px 0; font-size: 14px; line-height: 1.45; }
  .rsec.certo { border-left-color: var(--st-agendado); } .rsec.errado { border-left-color: var(--erro); } .rsec.passos { border-left-color: var(--ouro); } .rsec.audit { border-left-color: var(--t-story); }
  .resp { margin-top: 12px; } .resp summary { cursor: pointer; font-family: Montserrat, sans-serif; font-weight: 900; font-size: 14px; color: var(--ouro); padding: 6px 0; }
  .resp h4 { font-family: Montserrat, sans-serif; font-size: 14px; margin: 14px 0 4px; color: #fff; } .resp p, .resp li { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.9); }
  .resp ul, .resp ol { padding-left: 18px; margin: 4px 0; }
  /* métricas (13/11) */
  #metricas { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: rgba(10,42,94,0.55); border: 1px solid var(--linha); border-radius: 16px; padding: 14px; }
  .kpi b { display: block; font-family: Montserrat, sans-serif; font-weight: 900; font-size: 26px; color: var(--ouro); }
  .kpi span { font-size: 12px; color: var(--suave); }
  .bloco { background: rgba(10,42,94,0.55); border: 1px solid var(--linha); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .bloco h3 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px; color: var(--suave); }
  .linha-m { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha); font-size: 13px; }
  .linha-m:first-of-type { border-top: 0; }
  .linha-m .n { font-family: Montserrat, sans-serif; font-weight: 900; color: var(--ouro); width: 22px; }
  .linha-m .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linha-m .t a { color: var(--texto); text-decoration: none; }
  .linha-m .v { font-family: Montserrat, sans-serif; font-weight: 800; white-space: nowrap; }
  .barra-m { height: 8px; border-radius: 99px; background: var(--ciano); }
  .periodos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .periodos button { padding: 8px 14px; }
  .periodos button.ativa { background: var(--ouro); color: #04122B; border-color: var(--ouro); }
  table.cresc { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.cresc th { text-align: right; font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--suave); padding: 6px 4px; }
  table.cresc th:first-child, table.cresc td:first-child { text-align: left; }
  table.cresc td { text-align: right; padding: 9px 4px; border-top: 1px solid var(--linha); white-space: nowrap; }
  table.cresc td:first-child { white-space: normal; }
  table.cresc td.v { font-family: Montserrat, sans-serif; font-weight: 900; }
  .gtit { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; margin: 4px 0 6px; }
  .gtit b { font-family: Montserrat, sans-serif; font-size: 16px; }
  .gtit span { font-size: 12px; color: var(--suave); }
  .lg { display: inline-block; width: 18px; height: 3px; margin: 0 5px 3px 10px; vertical-align: middle; }
  .lg.a { background: #E2B33C; } .lg.b { background: repeating-linear-gradient(90deg, rgba(127,178,255,0.8) 0 5px, transparent 5px 9px); }
  .graf { width: 100%; height: auto; display: block; }
  .mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .mcard { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; border-radius: 14px; padding: 10px 12px; background: rgba(255,255,255,0.05); font-family: Nunito, sans-serif; font-weight: 700; }
  .mcard span:first-child { font-size: 12px; color: var(--suave); }
  .mcard b { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 20px; }
  .mcard.sel { border-color: var(--ouro); background: rgba(226,179,60,0.14); }
  .sobe { color: var(--ok); font-weight: 800; } .desce { color: var(--erro); font-weight: 800; }
  .tag { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,0.1); margin-right: 6px; }
  .vdecide { display: flex; gap: 10px; justify-content: center; padding: 10px 16px 0; }
  .vdecide[hidden] { display: none; }
  .vdecide button { font-size: 15px; padding: 12px 22px; }
  button.aprova { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.veta { background: transparent; border-color: var(--erro); color: #ffb3b5; }
  button.cancela { background: transparent; border-color: rgba(255,255,255,0.35); color: #fff; }
  .post button.cancela { margin-top: 6px; padding: 5px 10px; font-size: 12px; border-radius: 99px; }
  .tipos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tipos .etq { font-size: 11px; padding: 4px 12px; }
  .versao { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--ciano); color: #04122B; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .topo { justify-content: center; } .topo h1 { width: 100%; text-align: center; font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Agenda <span>@meuarraisamador</span></h1>
    <nav class="abas" role="tablist">
      <button id="abaAgenda" class="aba ativa" role="tab">📅 Agenda</button>
      <button id="abaMetricas" class="aba" role="tab">📊 Métricas</button>
    </nav>
  </div>
  <div id="ctrlAgenda">
    <div class="navsem">
      <button id="ant" class="seta" aria-label="Semana anterior">‹</button>
      <div class="semtxt"><b id="titulo"></b><button id="hoje" class="link" hidden>↩ voltar para esta semana</button></div>
      <button id="prox" class="seta" aria-label="Próxima semana">›</button>
    </div>
    <div class="pend" id="pend" hidden>
      <div class="pendtxt"><b id="pendn"></b><span>esperando sua aprovação</span></div>
      <div class="pendbot"><button id="revisar" class="destaque">▶ Ver um por um</button><button id="aprovartodos" class="aprova"></button></div>
    </div>
    <div class="resumo" id="resumo"></div>
    <div class="tipos" id="tipos"></div>
  </div>
</header>
<main id="grade"></main>
<section id="metricas" hidden></section>
<footer id="rodape"></footer>
<div id="visor" role="dialog" aria-modal="true" aria-label="Mídia do post">
  <div class="vtopo">
    <div class="vt" id="vtitulo"></div>
    <button class="vfechar" id="vfechar" aria-label="Fechar">✕</button>
  </div>
  <div class="vmidia" id="vmidia"></div>
  <div class="vlegwrap"><div class="vlegenda" id="vlegenda"></div><button id="vcopiar" class="vcopiar" title="Copiar legenda" aria-label="Copiar legenda" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button></div>
  <div class="vdecide" id="vdecide" hidden>
    <button class="aprova" id="vaprova">✅ Aprovar este</button>
    <button class="veta" id="vveta">❌ Vetar</button>
    <button class="cancela" id="vcancela">↩ Cancelar agendamento</button>
  </div>
  <div class="vbase">
    <button id="vant">‹ Anterior</button>
    <div class="vcont"><span id="vcont"></span><br><button id="vbaixar" class="destaque" style="margin-top:8px">⬇ Baixar</button></div>
    <button id="vprox">Próximo ›</button>
  </div>
</div>
<script>
const STATUS = {
  publicado: { cor: "var(--st-publicado)", txt: "Publicado", ic: "✔ " },
  pendente: { cor: "var(--st-agendado)", txt: "Agendado", ic: "✓ " },
  rascunho: { cor: "var(--st-aguarda)", txt: "Aguardando sua aprovação", ic: "⏳ " },
  erro: { cor: "var(--erro)", txt: "Falhou" },
  atrasado: { cor: "var(--erro)", txt: "Não saiu (atrasado)" },
  cancelado: { cor: "var(--canc)", txt: "Cancelado" },
};
const TIPO = { story: "Story", post: "Post", carrossel: "Carrossel", reel: "Reel" };
const corTipo = (t) => "var(--t-" + (TIPO[t] ? t : "post") + ")";
const RGB = { story: "62,230,255", post: "180,140,255", carrossel: "255,159,67", reel: "255,92,138" };
const fundoTipo = (t) => "linear-gradient(90deg, rgba(" + (RGB[t] || RGB.post) + ",0.20), rgba(" + (RGB[t] || RGB.post) + ",0.04) 60%), var(--cartao)";
const etqTipo = (t, txt) => '<span class="etq" style="background:' + corTipo(t) + '">' + (txt || TIPO[t] || t) + "</span>";
const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
let fila = [];
let inicio = segunda(new Date());

function segunda(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function mesmoDia(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dd(d) { return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); }

// CSV simples com aspas
function lerCSV(txt) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  txt = txt.replace(/^﻿/, "");
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (aspas) { if (c === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (c === '"') aspas = false; else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  const cab = linhas.shift() || [];
  return linhas.filter((l) => l.length > 1).map((l) => Object.fromEntries(cab.map((k, i) => [k.trim(), (l[i] || "").trim()])));
}

async function carregar() {
  try {
    const r = await fetch("fila.csv?t=" + Date.now(), { cache: "no-store" });
    fila = lerCSV(await r.text()).map((p) => ({ ...p, data: new Date(p.quando) }));
    document.getElementById("rodape").textContent = "Última leitura da fila: " + new Date().toLocaleTimeString("pt-BR") + " · " + fila.length + " itens na fila. Toque num post para ver a arte inteira, o vídeo e a legenda. Stories com sticker (quiz, enquete, caixinha) e o CTA de link das 20h são postados por você no app.";
  } catch (e) {
    document.getElementById("rodape").textContent = "Não consegui ler a fila agora (" + e + "). Tente recarregar.";
  }
  desenhar();
}

function mini(p) {
  const a = (p.arquivos || "").split("|")[0].trim();
  if (!a) return '<div class="mini">—</div>';
  if (p.status === "publicado") return '<div class="mini">✓</div>'; // a mídia sai do repositório depois de postada
  if (/\.(mp4|mov)$/i.test(a)) return '<div class="mini"><video src="' + a + '#t=2.6" muted preload="metadata"></video></div>';
  return '<div class="mini" style="background-image:url(\'' + a + '\')"></div>';
}

function cartao(p) {
  const s = STATUS[p.status] || { cor: "var(--rasc)", txt: p.status || "—" };
  const h = String(p.data.getHours()).padStart(2, "0") + ":" + String(p.data.getMinutes()).padStart(2, "0");
  const n = (p.arquivos || "").split("|").filter((x) => x.trim()).length;
  const tipo = etqTipo(p.tipo) + (p.tipo === "carrossel" ? n + " slides" : "");
  let st = '<span class="pill" style="background:' + s.cor + '">' + (s.ic || "") + s.txt + "</span>";
  if (p.status === "publicado" && /^https?:/.test(p.resultado)) st += ' <a href="' + p.resultado + '" target="_blank" rel="noopener">ver ↗</a>';
  const nota = (p.status === "erro" || p.status === "atrasado") && p.resultado ? '<div class="nota">' + p.resultado.replace(/</g, "&lt;") + "</div>" : "";
  const abrir = p.status === "publicado" ? "" : '<div class="abrir">Toque para ver ›</div>';
  const v = versao(p);
  const cancela = p.status === "pendente" ? '<button class="cancela" data-cancela="' + fila.indexOf(p) + '">↩ Cancelar agendamento</button>' : "";
  const classe = p.status === "rascunho" ? " aguarda" : p.status === "pendente" ? " agendado" : "";
  return '<div class="post' + classe + '" data-i="' + fila.indexOf(p) + '" style="border-left-color:' + corTipo(p.tipo) + ';background:' + fundoTipo(p.tipo) + '">' + mini(p) + '<div class="info"><div class="hora">' + h + '</div><div class="tipo">' + tipo + (v ? '<span class="versao">VERSÃO ' + v + "</span>" : "") + '</div><div class="status">' + st + "</div>" + nota + abrir + cancela + "</div></div>";
}

// arte do CTA do dia: mesma rotação do aviso do GitHub (cta.yml): 14 artes a partir de 12/11/2026
function ctaDoDia(d) {
  const dias = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2026, 10, 12)) / 86400000);
  if (dias < 0) return null;
  const n = String((dias % 14) + 1).padStart(2, "0");
  const data = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 20, 0);
  return { cta: true, data, tipo: "story", status: "manual", arquivos: "midia/cta/cta-" + n + ".jpg", legenda: "" };
}

// ---------------------------------------------------------------- versões e aprovação
// versões: rascunhos com o mesmo horário e tipo (ex.: v1 e v2 de um story); aprovar um cancela o outro (aprovacao.py)
function irmaos(p) { return fila.filter((o) => o !== p && o.status === "rascunho" && o.quando === p.quando && o.tipo === p.tipo); }
function versao(p) { if (p.status !== "rascunho" || !irmaos(p).length) return 0; const m = (p.arquivos || "").match(/-v(\d+)[a-z]?\.\w+\s*($|\|)/); return m ? +m[1] : 1; }
function primeiroArq(p) { return (p.arquivos || "").split("|")[0].trim(); }
// abre um pedido (issue) já preenchido no GitHub; ao enviar, a nuvem agenda e responde em ~1 min
// aprovação dentro do app: janela de confirmação e o issue é criado pela API (a Action de aprovação faz o resto).
// A chave (token do GitHub só com permissão de Issues neste repositório) fica guardada neste aparelho.
const CHAVE = "maa-chave-github";
function lerChave() { try { return localStorage.getItem(CHAVE) || ""; } catch (e) { return ""; } }
function pedir(acao, itens) {
  const linhas = itens.map((p) => acao + ": " + primeiroArq(p)).join("\n");
  const titulo = acao === "aprovar" ? "Aprova" + (itens.length > 1 ? "r " + itens.length + " posts" : "r post de " + dd(itens[0].data) + " " + hhmm(itens[0].data))
    : acao === "cancelar" ? "Aprovação: cancelar agendamento de " + dd(itens[0].data) + " " + hhmm(itens[0].data)
    : "Aprovação: vetar " + itens.length + " post" + (itens.length > 1 ? "s" : "");
  const T = {
    aprovar: { tit: itens.length > 1 ? "Aprovar " + itens.length + " posts?" : "Aprovar este post?", sim: "Aprovar", nao: "Não aprovar", ok: "✅ Aprovado" },
    vetar: { tit: itens.length > 1 ? "Vetar " + itens.length + " posts?" : "Vetar este post?", sim: "Vetar", nao: "Cancelar", ok: "❌ Vetado" },
    cancelar: { tit: "Cancelar o agendamento?", sim: "Cancelar agendamento", nao: "Voltar", ok: "↩ Agendamento cancelado" },
  }[acao];
  const cx = document.getElementById("confirma");
  const precisaChave = !lerChave();
  document.getElementById("ctit").textContent = T.tit;
  document.getElementById("csub").innerHTML = (itens.length === 1 ? esc(nomeDia(itens[0].data) + " " + dd(itens[0].data) + " · " + hhmm(itens[0].data)) : "") + (acao === "cancelar" ? "<br>Ele não será postado e volta para “Aguardando sua aprovação”." : "");
  if (precisaChave) document.getElementById("csub").innerHTML += '<br><br>Primeira vez neste aparelho: cole a chave do GitHub. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Criar chave</a> (repositório maa-publicador, permissão Issues: leitura e escrita).';
  document.getElementById("cchave").hidden = !precisaChave;
  const sim = document.getElementById("csim"); sim.hidden = false; sim.disabled = false;
  sim.textContent = T.sim;
  document.getElementById("cnao").textContent = T.nao;
  cx.classList.add("aberto");
  document.getElementById("cnao").onclick = () => cx.classList.remove("aberto");
  sim.onclick = async () => {
    let chave = lerChave();
    if (!chave) { chave = document.getElementById("cinput").value.trim(); if (!chave) return; try { localStorage.setItem(CHAVE, chave); } catch (e) {} }
    sim.disabled = true; sim.textContent = "Enviando…";
    try {
      const r = await fetch("https://api.github.com/repos/denysdmo/maa-publicador/issues", { method: "POST", headers: { Authorization: "Bearer " + chave, Accept: "application/vnd.github+json" }, body: JSON.stringify({ title: titulo, body: "Enviado pelo app.\n\n" + linhas }) });
      if (r.status === 401 || r.status === 403 || r.status === 404) { try { localStorage.removeItem(CHAVE); } catch (e) {} throw new Error("chave"); }
      if (!r.ok) throw new Error("http " + r.status);
      document.getElementById("ctit").textContent = T.ok;
      document.getElementById("csub").textContent = "A agenda atualiza em cerca de 1 minuto.";
      document.getElementById("cchave").hidden = true;
      setTimeout(() => { cx.classList.remove("aberto"); location.reload(); }, 60000);
      sim.hidden = true; document.getElementById("cnao").textContent = "Fechar";
    } catch (e) {
      document.getElementById("csub").textContent = e.message === "chave" ? "A chave não funcionou. Toque de novo e cole uma chave válida." : "Não consegui enviar agora. Tente de novo.";
    } finally { sim.disabled = false; if (!sim.hidden) sim.textContent = T.sim; }
  };
}

// ---------------------------------------------------------------- visor de mídia
let lista = [], pos = 0;
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function nomeDia(d) { return ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"][d.getDay()]; }

function abrirVisor(itens, i) {
  lista = itens; pos = i;
  document.getElementById("visor").classList.add("aberto");
  document.body.style.overflow = "hidden";
  mostrar();
}
function fecharVisor() {
  document.getElementById("visor").classList.remove("aberto");
  document.body.style.overflow = "";
  document.getElementById("vmidia").innerHTML = "";
}
async function mostrar() {
  const p = lista[pos];
  const s = p.cta ? { cor: "var(--ouro)", txt: "Você posta: sticker de LINK com meuarraisamador.com.br" } : STATUS[p.status] || { cor: "var(--rasc)", txt: p.status || "—" };
  const arqs = (p.arquivos || "").split("|").map((x) => x.trim()).filter(Boolean);
  const v = p.cta ? 0 : versao(p);
  const tipo = (v ? "Versão " + v + " · " : "") + (p.cta ? "Story de CTA (manual)" : (TIPO[p.tipo] || p.tipo) + (p.tipo === "carrossel" ? " · " + arqs.length + " slides (deslize)" : ""));
  document.getElementById("vtitulo").innerHTML = '<div class="hora">' + nomeDia(p.data) + " " + dd(p.data) + " · " + hhmm(p.data) + '</div><div class="tipo">' + esc(tipo) + '</div><div class="status">' + (p.cta ? '<span style="color:' + s.cor + '">' + esc(s.txt) + "</span>" : '<span class="pill" style="background:' + s.cor + '">' + (s.ic || "") + esc(s.txt) + "</span>") + "</div>";
  const m = document.getElementById("vmidia");
  if (p.status === "publicado") {
    const link = /^https?:/.test(p.resultado) ? '<br><br><a href="' + esc(p.resultado) + '" target="_blank" rel="noopener">Ver no Instagram ↗</a>' : "";
    m.innerHTML = '<div class="aviso">Já publicado. A mídia sai daqui depois de postada.' + link + "</div>";
  } else if (!arqs.length) {
    m.innerHTML = '<div class="aviso">Este item não tem mídia.</div>';
  } else {
    m.innerHTML = arqs.map((a) => /\.(mp4|mov)$/i.test(a)
      ? '<video src="' + esc(a) + '" controls playsinline preload="metadata"></video>'
      : '<img src="' + esc(a) + '" alt="">').join("");
  }
  m.scrollLeft = 0;
  document.getElementById("vcont").textContent = pos + 1 + " de " + lista.length;
  document.getElementById("vant").disabled = pos === 0;
  document.getElementById("vprox").disabled = pos === lista.length - 1;
  document.getElementById("vdecide").hidden = p.cta || (p.status !== "rascunho" && p.status !== "pendente");
  document.getElementById("vaprova").hidden = document.getElementById("vveta").hidden = p.status !== "rascunho";
  document.getElementById("vcancela").hidden = p.status !== "pendente";
  document.getElementById("vaprova").textContent = v ? "✅ Escolher a versão " + v : "✅ Aprovar este";
  document.getElementById("vbaixar").hidden = p.status === "publicado" || !arqs.length;
  const leg = document.getElementById("vlegenda");
  leg.textContent = "";
  document.getElementById("vcopiar").hidden = true;
  if (p.legenda) {
    try {
      const r = await fetch(p.legenda + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok && lista[pos] === p) leg.textContent = (await r.text()).trim();
      document.getElementById("vcopiar").hidden = !leg.textContent;
    } catch (e) { /* sem legenda */ }
  }
}
function passo(d) { const n = pos + d; if (n >= 0 && n < lista.length) { pos = n; mostrar(); } }

document.getElementById("grade").addEventListener("click", (e) => {
  const m = e.target.closest(".post[data-cta]");
  if (m) {
    const d = new Date(inicio); d.setDate(d.getDate() + +m.dataset.cta);
    const c = ctaDoDia(d);
    if (c) abrirVisor([c], 0);
    return;
  }
  const bc = e.target.closest("button[data-cancela]");
  if (bc) { pedir("cancelar", [fila[+bc.dataset.cancela]]); return; }
  const c = e.target.closest(".post[data-i]");
  if (!c || e.target.closest("a")) return;
  const p = fila[+c.dataset.i];
  const fim = new Date(inicio); fim.setDate(fim.getDate() + 7);
  const daSemana = fila.filter((x) => x.data >= inicio && x.data < fim).sort((a, b) => a.data - b.data);
  abrirVisor(daSemana, daSemana.indexOf(p));
});
document.getElementById("revisar").onclick = () => {
  const r = fila.filter((p) => p.status === "rascunho").sort((a, b) => a.data - b.data);
  if (r.length) abrirVisor(r, 0);
};
document.getElementById("vfechar").onclick = fecharVisor;
document.getElementById("vaprova").onclick = () => pedir("aprovar", [lista[pos]]);
document.getElementById("vveta").onclick = () => pedir("vetar", [lista[pos]]);
document.getElementById("vcancela").onclick = () => pedir("cancelar", [lista[pos]]);
document.getElementById("aprovartodos").onclick = () => {
  const r = fila.filter((p) => p.status === "rascunho" && !versao(p)).sort((a, b) => a.data - b.data);
  const comVersao = fila.filter((p) => p.status === "rascunho" && versao(p)).length;
  if (!r.length) return;
  // sem confirm() do navegador: se ele for bloqueado ("não mostrar mais diálogos"), o botão parecia morto (13/11)
  pedir("aprovar", r);
  if (comVersao) document.getElementById("csub").innerHTML += "<br>Os " + comVersao + " que têm versão 1 e 2 ficam de fora: escolha a versão abrindo cada um.";
};
// baixar a mídia aberta: no celular abre o menu de compartilhar ("Salvar imagem"); no computador, baixa o arquivo
document.getElementById("vbaixar").onclick = async () => {
  const p = lista[pos];
  const arqs = (p.arquivos || "").split("|").map((x) => x.trim()).filter(Boolean);
  try {
    const arquivos = await Promise.all(arqs.map(async (a) => {
      const b = await (await fetch(a)).blob();
      return new File([b], a.split("/").pop(), { type: b.type || (/\.mp4$/i.test(a) ? "video/mp4" : "image/jpeg") });
    }));
    if (navigator.canShare && navigator.canShare({ files: arquivos })) { await navigator.share({ files: arquivos }); return; }
    for (const f of arquivos) {
      const u = URL.createObjectURL(f), l = document.createElement("a");
      l.href = u; l.download = f.name; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 5000);
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    window.open(arqs[0], "_blank");
  }
};
document.getElementById("vcopiar").onclick = async (e) => {
  const txt = document.getElementById("vlegenda").textContent;
  const b = e.currentTarget; b.classList.add("ok"); b.title = "Legenda copiada"; setTimeout(() => { b.classList.remove("ok"); b.title = "Copiar legenda"; }, 1500);
  try { await navigator.clipboard.writeText(txt); } catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("vlegenda")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
};
document.getElementById("vant").onclick = () => passo(-1);
document.getElementById("vprox").onclick = () => passo(1);
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("visor").classList.contains("aberto")) return;
  if (e.key === "Escape") fecharVisor();
  if (e.key === "ArrowLeft") passo(-1);
  if (e.key === "ArrowRight") passo(1);
});
// deslizar para o lado troca de post (no carrossel, deslizar passa os slides; use os botões para trocar de post)
let toque = null;
const vm = document.getElementById("vmidia");
vm.addEventListener("touchstart", (e) => { toque = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
vm.addEventListener("touchend", (e) => {
  if (!toque || vm.children.length > 1) return;
  const dx = e.changedTouches[0].clientX - toque[0], dy = e.changedTouches[0].clientY - toque[1];
  if (Math.abs(dx) > 60 && Math.abs(dy) < 60) passo(dx < 0 ? 1 : -1);
  toque = null;
}, { passive: true });

function desenhar() {
  const fim = new Date(inicio); fim.setDate(fim.getDate() + 7);
  document.getElementById("titulo").textContent = dd(inicio) + " a " + dd(new Date(fim.getTime() - 86400000));
  const daSemana = fila.filter((p) => p.data >= inicio && p.data < fim);
  const conta = (st) => daSemana.filter((p) => p.status === st).length;
  const rasc = fila.filter((p) => p.status === "rascunho").length;
  const rv = document.getElementById("revisar");
  document.getElementById("pend").hidden = !rasc;
  document.getElementById("pendn").textContent = rasc + (rasc === 1 ? " post" : " posts");
  document.getElementById("hoje").hidden = mesmoDia(inicio, segunda(new Date()));
  const semVersao = fila.filter((p) => p.status === "rascunho" && !versao(p));
  const at = document.getElementById("aprovartodos");
  at.hidden = !semVersao.length;
  at.textContent = rasc > semVersao.length ? "✅ Aprovar " + semVersao.length + " (as versões 1/2 você escolhe)" : "✅ Aprovar todos";
  document.getElementById("tipos").innerHTML = ["story", "post", "carrossel", "reel"].map((t) => etqTipo(t)).join("");
  document.getElementById("resumo").innerHTML = ["publicado", "pendente", "rascunho", "erro"].map((k) => '<span class="chip"><i style="background:' + STATUS[k].cor + '"></i>' + STATUS[k].txt.split(" ")[0] + ": " + conta(k) + "</span>").join("");
  const hoje = new Date();
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicio); d.setDate(d.getDate() + i);
    const posts = daSemana.filter((p) => mesmoDia(p.data, d)).sort((a, b) => a.data - b.data);
    const c = ctaDoDia(d);
    const manual = '<div class="post manual" data-cta="' + i + '">' + (c ? '<div class="mini" style="background-image:url(' + c.arquivos + ')"></div>' : "") + '<div class="info"><div class="hora">20:00 · CTA com link</div><div class="tipo">' + etqTipo("story") + 'Você posta, com o sticker de link</div>' + (c ? '<div class="abrir">Toque para ver e baixar ›</div>' : "") + "</div></div>";
    html += '<section class="dia' + (mesmoDia(d, hoje) ? " hoje" : "") + '"><h2><span>' + DIAS[d.getDay()] + "</span><span>" + dd(d) + "</span></h2>" + (posts.length ? posts.map(cartao).join("") : '<div class="vazio">Nada agendado</div>') + manual + "</section>";
  }
  document.getElementById("grade").innerHTML = html;
}

document.getElementById("ant").onclick = () => { inicio.setDate(inicio.getDate() - 7); desenhar(); };
document.getElementById("prox").onclick = () => { inicio.setDate(inicio.getDate() + 7); desenhar(); };
document.getElementById("hoje").onclick = () => { inicio = segunda(new Date()); desenhar(); };
// ---------------------------------------------------------------- métricas
let periodo = 7;
const METRICAS_C = [
  ["views", "Visualizações (posts, reels e stories)"], ["reach", "Contas alcançadas"], ["profile_views", "Visitas ao perfil"],
  ["website_clicks", "Cliques no link da bio"], ["follower_count", "Novos seguidores"], ["accounts_engaged", "Contas que interagiram"],
  ["total_interactions", "Interações"], ["likes", "Curtidas"], ["comments", "Comentários"], ["shares", "Compartilhamentos"],
  ["saves", "Salvamentos"], ["replies", "Respostas aos stories"], ["_posts", "Publicações no feed"],
];
let metricaSel = "views";
// "Hoje" (14/11): um dia só não faz linha; mostra hoje × ontem em barras
function barrasHoje(h, o) {
  const W = 640, H = 220, base = H - 30, max = Math.max(1, h || 0, o || 0);
  const barra = (v, x, cor, txt) => { const alt = ((v || 0) / max) * (H - 70); return '<rect x="' + x + '" y="' + (base - alt) + '" width="150" height="' + alt + '" rx="10" fill="' + cor + '"/><text x="' + (x + 75) + '" y="' + (base - alt - 8) + '" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">' + (v === null || v === undefined ? "—" : fmt(v)) + '</text><text x="' + (x + 75) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.65)">' + txt + "</text>"; };
  return '<svg viewBox="0 0 ' + W + " " + H + '" class="graf">' + barra(o, 140, "rgba(127,178,255,0.55)", "Ontem") + barra(h, 350, "#E2B33C", "Hoje (até agora)") + "</svg>";
}
function tabelaCrescimento(r, c) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const dias = (de, ate) => { const out = []; for (let k = ate - 1; k >= de; k--) { const d = new Date(hoje); d.setDate(d.getDate() - k); out.push(iso(d)); } return out; };
  const atual = dias(0, periodo), ant = dias(periodo, 2 * periodo);
  const porDia = Object.fromEntries(c.map((l) => [l.data, l]));
  const ppd = r.publicacoes_por_dia || {};
  const val = (d, k) => { if (k === "_posts") return porDia[d] ? (ppd[d] || 0) : null; const v = porDia[d] && porDia[d][k]; return v === undefined || v === "" || v === null ? null : Number(v) || 0; };
  const soma = (ds, k) => { const v = ds.map((d) => val(d, k)).filter((x) => x !== null); return v.length >= ds.length * 0.8 ? v.reduce((a, b) => a + b, 0) : null; };
  const variacao = (a, b) => (a === null || !b ? null : ((a - b) / b) * 100);
  const seta = (p) => p === null ? '<span class="sub">sem comparação</span>' : '<span class="' + (p >= 0 ? "sobe" : "desce") + '">' + (p >= 0 ? "▲ " : "▼ ") + Math.abs(p).toFixed(0) + "%</span>";
  // cartões: total do período + variação; tocar escolhe a métrica do gráfico
  const cards = METRICAS_C.map(([k, nome]) => {
    const a = soma(atual, k), b = soma(ant, k);
    // "Hoje" é um dia em andamento: nada de queda vermelha falsa; mostra quanto já é do total de ontem
    const comp = periodo === 1 ? '<span class="sub">' + (a === null || !b ? "dia em andamento" : Math.round((a / b) * 100) + "% do total de ontem") + "</span>" : seta(variacao(a, b));
    return '<button class="mcard' + (k === metricaSel ? " sel" : "") + '" data-k="' + k + '"><span>' + nome + "</span><b>" + fmt(a) + "</b>" + comp + "</button>";
  }).join("");
  // gráfico SVG: período atual (linha cheia + área) e anterior (tracejado)
  const W = 640, H = 220, P = 34;
  const ya = atual.map((d) => val(d, metricaSel)), yb = ant.map((d) => val(d, metricaSel));
  const max = Math.max(1, ...ya.filter((v) => v !== null), ...yb.filter((v) => v !== null));
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, periodo - 1);
  const y = (v) => H - 24 - (v / max) * (H - 50);
  const linha = (ys) => ys.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean).map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const la = linha(ya), lb = linha(yb);
  const pts = ya.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean);
  const area = pts.length ? la + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (H - 24) + " L" + pts[0][0].toFixed(1) + " " + (H - 24) + " Z" : "";
  const dm = (d) => d.slice(8, 10) + "/" + d.slice(5, 7);
  const rotulos = [...new Set([0, Math.floor((periodo - 1) / 2), periodo - 1])].map((i) => '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.6)">' + dm(atual[i]) + "</text>").join("");
  const grade = [0, 0.5, 1].map((f) => '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(max * f) + '" y2="' + y(max * f) + '" stroke="rgba(255,255,255,0.08)"/><text x="' + (P - 6) + '" y="' + (y(max * f) + 4) + '" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.5)">' + (max * f >= 1000 ? (max * f / 1000).toFixed(1) + "k" : Math.round(max * f)) + "</text>").join("");
  const pontos = periodo <= 30 ? pts.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#E2B33C"/>').join("") : "";
  const nomeSel = (METRICAS_C.find((m) => m[0] === metricaSel) || [, ""])[1];
  const desde = c.length ? c[c.length - 1].data.split("-").reverse().join("/") : "—";
  document.getElementById("tabcresc").innerHTML =
    '<div class="gtit"><b>' + nomeSel + '</b><span><i class="lg a"></i>' + (periodo === 1 ? "hoje (até agora)" : "últimos " + periodo + " dias") + ' <i class="lg b"></i>' + (periodo === 1 ? "ontem" : periodo + " dias antes") + "</span></div>"
    + (periodo === 1 ? barrasHoje(ya[0], yb[0]) : '<svg viewBox="0 0 ' + W + " " + H + '" class="graf"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B33C" stop-opacity="0.35"/><stop offset="1" stop-color="#E2B33C" stop-opacity="0"/></linearGradient></defs>'
    + grade + (lb ? '<path d="' + lb + '" fill="none" stroke="rgba(127,178,255,0.7)" stroke-width="2" stroke-dasharray="6 5"/>' : "") + (area ? '<path d="' + area + '" fill="url(#ga)"/>' : "") + (la ? '<path d="' + la + '" fill="none" stroke="#E2B33C" stroke-width="3" stroke-linejoin="round"/>' : "") + pontos + rotulos + "</svg>")
    + '<div class="mcards">' + cards + "</div>"
    + '<div class="sub" style="margin-top:8px">Toque numa métrica para ver o gráfico dela. Dados diários desde ' + desde + ".</div>";
  document.querySelectorAll(".mcard").forEach((b) => (b.onclick = () => { metricaSel = b.dataset.k; tabelaCrescimento(r, c); }));
}
const fmt = (n) => (n === null || n === undefined || n === "") ? "—" : Number(n).toLocaleString("pt-BR");

// ---------------------------------------------------------------- relatório da semana (14/11)
let relSem = 0, relIndice = null;
function mdHtml(t) {
  const inl = (x) => esc(x).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let html = "", lista = "";
  const fecha = () => { if (lista) { html += "</" + lista + ">"; lista = ""; } };
  for (const l of t.split(String.fromCharCode(10)).map((x) => x.trim() ? x.replace(/ +$/, "") : "")) {
    let m;
    if ((m = l.match(/^#{1,3}\s+(.*)/))) { fecha(); html += "<h4>" + inl(m[1]) + "</h4>"; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (lista !== "ul") { fecha(); html += "<ul>"; lista = "ul"; } html += "<li>" + inl(m[1]) + "</li>"; }
    else if ((m = l.match(/^\s*\d+\.\s+(.*)/))) { if (lista !== "ol") { fecha(); html += "<ol>"; lista = "ol"; } html += "<li>" + inl(m[1]) + "</li>"; }
    else if (l.trim()) { fecha(); html += "<p>" + inl(l) + "</p>"; }
  }
  fecha();
  return html;
}
async function blocoRelatorio() {
  const el = document.getElementById("relatorio");
  if (!el) return;
  try { if (!relIndice) relIndice = await (await fetch("metricas/relatorios/indice.json?t=" + Date.now(), { cache: "no-store" })).json(); }
  catch (e) { relIndice = []; }
  if (!relIndice.length) { el.innerHTML = "<h3>Relatório da semana</h3><div class=\"sub\">O primeiro relatório sai na segunda de manhã.</div>"; return; }
  relSem = Math.max(0, Math.min(relSem, relIndice.length - 1));
  const w = relIndice[relSem];
  let r;
  try { r = await (await fetch("metricas/relatorios/" + w.ini + ".json?t=" + Date.now(), { cache: "no-store" })).json(); }
  catch (e) { el.innerHTML = "<h3>Relatório da semana</h3><div class=\"sub\">Não consegui abrir este relatório.</div>"; return; }
  let esp = "";
  if (w.especialista) {
    try { esp = await (await fetch("metricas/relatorios/" + w.ini + "-especialista.md?t=" + Date.now(), { cache: "no-store" })).text(); } catch (e) {}
  }
  const d = (iso) => iso.slice(8, 10) + "/" + iso.slice(5, 7);
  const lst = (a) => "<ul>" + a.map((t) => "<li>" + esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>") + "</li>").join("") + "</ul>";
  const nums = r.numeros.map((x) => {
    const dl = x.delta === null || x.delta === undefined ? "" : '<i class="' + (x.delta >= 0 ? "sobe" : "desce") + '">' + (x.delta >= 0 ? "▲ " : "▼ ") + Math.abs(x.delta) + "%</i>";
    return '<div class="rnum"><span>' + esc(x.rotulo) + "</span><b>" + fmt(x.valor) + "</b>" + dl + "</div>";
  }).join("");
  el.innerHTML = '<h3>Relatório da semana</h3><div class="rtopo"><button id="relAnt"' + (relSem >= relIndice.length - 1 ? " disabled" : "") + '>‹</button><b>' + d(r.semana.ini) + " a " + d(r.semana.fim) + '</b><button id="relProx"' + (relSem === 0 ? " disabled" : "") + ">›</button></div>"
    + '<div class="rnums">' + nums + "</div>"
    + '<div class="rsec certo"><h4>✅ O que deu certo</h4>' + lst(r.certo) + "</div>"
    + '<div class="rsec errado"><h4>⚠️ O que deu errado</h4>' + lst(r.errado) + "</div>"
    + '<div class="rsec passos"><h4>➡️ Próximos passos</h4>' + lst(r.passos) + "</div>"
    + '<div class="rsec audit"><h4>🔎 Auditoria</h4>' + lst(r.auditoria) + "</div>"
    + (esp ? '<details class="resp" open><summary>📝 Análise do especialista</summary>' + mdHtml(esp) + "</details>" : '<div class="sub" style="margin-top:10px">A análise escrita do especialista entra na rodada de sexta.</div>')
    + '<div class="sub" style="margin-top:8px">Comparações com a semana anterior · gerado em ' + new Date(r.gerado).toLocaleString("pt-BR") + "</div>";
  document.getElementById("relAnt").onclick = () => { relSem++; blocoRelatorio(); };
  document.getElementById("relProx").onclick = () => { relSem--; blocoRelatorio(); };
}
async function mostrarMetricas() {
  const el = document.getElementById("metricas");
  let r;
  try { r = await (await fetch("metricas/resumo.json?t=" + Date.now(), { cache: "no-store" })).json(); }
  catch (e) { el.innerHTML = '<div class="bloco">As métricas ainda não foram coletadas.</div>'; return; }
  const c = r.conta || r.conta_28d || [];
  window._resumo = r;
  const soma = (k, n) => c.slice(0, n).reduce((a, d) => a + (Number(d[k]) || 0), 0);
  const kpis = [["Seguidores", fmt(r.seguidores)], ["Alcance (7 dias)", fmt(soma("reach", 7))], ["Novos seguidores (7 dias)", fmt(soma("follower_count", 7))], ["Visitas ao perfil (7 dias)", fmt(soma("profile_views", 7))], ["Cliques no link (7 dias)", fmt(soma("website_clicks", 7))]];
  const lista = (itens, val) => itens.map((m, i) => '<div class="linha-m"><span class="n">' + (i + 1) + '</span><span class="t"><span class="tag">' + esc(m.formato) + "</span>" + '<a href="' + esc(m.link) + '" target="_blank" rel="noopener">' + esc(m.data.slice(8, 10) + "/" + m.data.slice(5, 7) + " · " + (m.legenda || "(sem legenda)")) + '</a></span><span class="v">' + val(m) + "</span></div>").join("");
  const maxF = Math.max(1, ...Object.values(r.por_formato).map((f) => f.alcance));
  const formatos = Object.entries(r.por_formato).sort((a, b) => b[1].alcance - a[1].alcance).map(([k, f]) => '<div class="linha-m"><span class="t"><span class="tag">' + esc(k) + "</span>" + f.posts + ' posts · salvos ' + fmt(f.salvos) + " · compart. " + fmt(f.compart) + '<div class="barra-m" style="width:' + (f.alcance / maxF * 100) + '%;margin-top:6px"></div></span><span class="v">' + fmt(f.alcance) + "</span></div>").join("");
  const dias = Object.entries(r.por_dia).filter(([, d]) => d.posts).sort((a, b) => b[1].alcance - a[1].alcance).map(([k, d]) => '<div class="linha-m"><span class="t">' + k + " · " + d.posts + ' posts</span><span class="v">' + fmt(d.alcance) + "</span></div>").join("");
  const horas = Object.entries(r.por_hora).filter(([, h]) => h.posts >= 2).sort((a, b) => b[1].alcance - a[1].alcance).slice(0, 6).map(([k, h]) => '<div class="linha-m"><span class="t">' + k + "h · " + h.posts + ' posts</span><span class="v">' + fmt(h.alcance) + "</span></div>").join("");
  const st = r.stories_medias || {};
  el.innerHTML = '<div class="bloco rel" id="relatorio"></div><div class="bloco"><h3>Crescimento do perfil</h3><div class="periodos" id="periodos">' + [1, 3, 7, 14, 30, 90].map((d) => '<button data-d="' + d + '"' + (d === periodo ? ' class="ativa"' : "") + ">" + (d === 1 ? "Hoje" : d + " dias") + "</button>").join("") + '</div><div id="tabcresc"></div></div>'
    + '<div class="sub" style="margin-bottom:10px">Atualizado em ' + new Date(r.atualizado).toLocaleString("pt-BR") + " · coleta automática a cada 3 h · alcance médio por publicação</div>"
    + '<div class="kpis">' + kpis.map(([t, v]) => '<div class="kpi"><b>' + v + "</b><span>" + t + "</span></div>").join("") + "</div>"
    + '<div class="bloco"><h3>Top 10 por alcance</h3>' + lista(r.top_alcance, (m) => fmt(m.reach) + " 👁") + "</div>"
    + '<div class="bloco"><h3>Top 10 por engajamento (salvos e compartilhamentos pesam mais)</h3>' + lista(r.top_engajamento, (m) => m.taxa_engaj + "%") + "</div>"
    + '<div class="bloco"><h3>Alcance médio por formato</h3>' + formatos + "</div>"
    + '<div class="bloco"><h3>Melhores dias</h3>' + dias + "</div>"
    + '<div class="bloco"><h3>Melhores horários</h3>' + horas + "</div>"
    + '<div class="bloco"><h3>Stories (média)</h3><div class="linha-m"><span class="t">Alcance · respostas · saídas</span><span class="v">' + fmt(st.alcance) + " · " + fmt(st.respostas) + " · " + fmt(st.saidas) + "</span></div></div>";
  document.getElementById("periodos").onclick = (e) => { const b = e.target.closest("button[data-d]"); if (b) { periodo = +b.dataset.d; mostrarMetricas(); } };
  tabelaCrescimento(r, c);
  blocoRelatorio();
}
function aba(qual) {
  const met = qual === "metricas";
  document.getElementById("metricas").hidden = !met;
  document.getElementById("grade").hidden = met;
  document.getElementById("ctrlAgenda").hidden = met;
  document.getElementById("rodape").hidden = met;
  document.getElementById("abaAgenda").classList.toggle("ativa", !met);
  document.getElementById("abaMetricas").classList.toggle("ativa", met);
  if (met) mostrarMetricas();
  window.scrollTo(0, 0);
}
document.getElementById("abaAgenda").onclick = () => aba("agenda");
document.getElementById("abaMetricas").onclick = () => aba("metricas");
carregar();
setInterval(carregar, 5 * 60 * 1000);
