name: Aprovar pelo app
# O botão "Aprovar"/"Vetar" da agenda abre um issue preenchido; este fluxo aplica na fila e fecha o issue.
# Segurança: só age em issue aberto pelo DONO do repositório (ninguém mais consegue aprovar).
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: publicador
  cancel-in-progress: false
jobs:
  aprovar:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Aprova')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplica na fila e salva (com nova tentativa se outro pedido salvar ao mesmo tempo)
        env:
          CORPO: ${{ github.event.issue.body }}
        run: |
          git config user.name "maa-publicador"
          git config user.email "actions@users.noreply.github.com"
          for tentativa in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            printf '%s' "$CORPO" | python aprovacao.py > resumo.txt
            cat resumo.txt
            [ -z "$(git status --porcelain fila.csv)" ] && exit 0
            git add fila.csv
            git commit -q -m "fila: aprovação pelo app (#${{ github.event.issue.number }})"
            git push -q origin HEAD:main && exit 0
            echo "outro pedido salvou antes; tentando de novo ($tentativa)"
            sleep $((tentativa * 4))
          done
          exit 1
      - name: Responde e fecha o pedido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file resumo.txt
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
