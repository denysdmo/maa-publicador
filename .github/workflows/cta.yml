name: Story de CTA do dia
on:
  schedule:
    - cron: "0 23 * * *"   # 20h de Brasília
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  cta:
    runs-on: ubuntu-latest
    steps:
      - name: Abre o aviso com a arte do dia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dias=$(( ( $(TZ=America/Sao_Paulo date +%s) - $(date -d 2026-11-12 +%s) ) / 86400 ))
          n=$(printf %02d $(( dias % 14 + 1 )))
          img="https://raw.githubusercontent.com/${GH_REPO}/main/midia/cta/cta-$n.jpg"
          gh issue create --title "Story de CTA de hoje ($(TZ=America/Sao_Paulo date +%d/%m))" --body "Poste no story e coloque o **sticker de LINK** com \`meuarraisamador.com.br\` no espaço da seta.

          <img src=\"$img\" width=\"300\">

          Para salvar no celular: abra $img e segure na imagem."
