name: Publicar fila do Instagram
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicador
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instala ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Publica o que venceu
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TZ: America/Sao_Paulo
        run: python publicador.py
      - name: Salva o status da fila
        run: |
          if ! git diff --quiet fila.csv; then
            git config user.name "maa-publicador"
            git config user.email "actions@users.noreply.github.com"
            git add fila.csv
            git commit -m "fila: status atualizado"
            git push
          fi
