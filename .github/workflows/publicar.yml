name: Publicar fila do Instagram
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (UTC); o GitHub pode atrasar alguns minutos
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: publicador
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instala ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Publica o que venceu
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TZ: America/Sao_Paulo
        run: python publicador.py | tee saida.txt
      - name: Salva o status da fila
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "maa-publicador"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "fila: status atualizado"
            git push
          fi
      - name: Avisa se algum post falhou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^FALHAS:" saida.txt; then
            gh issue create --assignee denysdmo --title "Post do Instagram NÃO saiu" --body "@denysdmo $(grep '^FALHAS:' saida.txt)

          Veja a fila: https://github.com/${{ github.repository }}/blob/main/fila.csv"
          fi
